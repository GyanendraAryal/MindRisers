<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>

<body>

    <pre>
            on click of below button fetch todos and display the title and completed status in a table 

    </pre>
    <button onclick="fetchTodos()"> fetch data from api. </button>

    // create a table here.
    <div id="todo-table">
        <table border="1">
            <thead>
                <tr>
                    <td>Title</td>
                    <td>Status</td>
                </tr>
            </thead>
            <tbody id="tbody">

            </tbody>
        </table>
    </div>


</body>

<script>

    function fetchTodos() {
        fetch('https://jsonplaceholder.typicode.com/todos')
            .then(response => response.json())
            .then(data => {
                // console.log(data);

                const tbody = document.querySelector("#tbody")
                tbody.innerHTML = ""

                data.forEach((todo) => {
                    const row = `
                        <tr>
                        <td>${todo.title}</td> 
                        <td>${todo.completed ? "Completed" : "Pending"}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row
                });
            })
            .catch((err) => console.log(err));
    }

</script>

</html>
