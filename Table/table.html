<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <h1>Table Creation</h1>
    <table border="2px">
        <thead>
            <tr>
                <th rowspan="2">Heading</th>
                <th>Students</th>
                <th colspan="3">Details</th>
            </tr>
             <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Department</th>
                <th>Roll Number</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="4">Student List</td>
                <td style="text-align: center; vertical-align:middle;">1</td>
                <td style="text-align: center; vertical-align:middle;">Victor</td>
                <td style="text-align: center; vertical-align:middle;">Computer Science</td>
                <td style="text-align: center; vertical-align:middle;">12345</td>
            </tr>
             <tr>
                 <td style="text-align: center; vertical-align:middle;">2</td>
                 <td style="text-align: center; vertical-align:middle;">Williams</td>
                 <td style="text-align: center; vertical-align:middle;">Electronics</td>
                 <td style="text-align: center; vertical-align:middle;">23456</td>
            </tr>
             <tr>
                <td style="text-align: center; vertical-align:middle;">3</td>
                <td style="text-align: center; vertical-align:middle;">Harry</td>
                <td style="text-align: center; vertical-align:middle;">Electrical</td>
                <td style="text-align: center; vertical-align:middle;">34567</td>
            </tr>
             <tr>
                 <td style="text-align: center; vertical-align:middle;">4</td>
                 <td style="text-align: center; vertical-align:middle;">Rick</td>
                <td style="text-align: center; vertical-align:middle;">Civil</td>
                <td style="text-align: center; vertical-align:middle;">45678</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
