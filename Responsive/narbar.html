<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NavBar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <!-- <script src='https://kit.fontawesome.com/a076d05399.js' crossorigin='anonymous'></script> -->
</head>
<style>
    * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }

    nav {
        display: flex;
        flex-wrap: wrap;
        flex-direction: row;
        justify-content: space-around;
        align-items: center;
        font-size: small;
        width: 100%;
        height: 40px;
        margin-top: 1rem;
        display: flex;
        background-color: rgb(88, 9, 225);
        color: white;
        /* border: 2px solid red; */
    }

    .box {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        min-height:25% ;
        width: auto;
        /* border: 2px solid red; */
    }

    .box ul {
        display: flex;
        flex-wrap: wrap;
        height: auto;
        list-style: none;
        gap: 2rem;
        /* border: 2px solid red; */
    }

    .color-white {
        display: inline-block;
        color: white;
        text-decoration: none;
        padding-left: 0.5rem;
    }

    .padding-right {
        display: inline-block;
        padding-right: 0.5rem;
    }
    .border-background{
        /* padding: 0; */
        display: inline-block;
        width: 62px;
        margin: 0;
        border: none;
        background-color: rgb(88, 9, 225);
        color: white;
    }
    .border-background1{
        width: auto;
        padding-right: auto;
        margin: 0;
        border: none;
        background-color: rgb(88, 9, 225);
        color: white;
    }
    
    @media (max-width: 650px){
        .item1 ul a{
            display: none;
        }
        .item1{
            gap: 1em;
            width: 10%;
        }
        .item1 ul p{
            display: none;

        }
    }
    @media(min-width:425px){
        .item1{
            display: flex;
            gap:1rem;
            justify-content: space-between;
            /* flex-direction: column; */
            /* flex-wrap: wrap; */
            /* align-items: start; */
        }
        .item1 ul{
            gap:0.5rem;
        }
        .boxitem2 ul{
            gap:1rem;
        }
    }
    @media(max-width:425px){
        .item1 ul{
            display: flex;   
            max-height: 20%;
            gap: 0.5rem;
            flex-direction: column;
            flex-wrap: wrap;
            align-items: start;
            justify-content: center;
        }
        .item2{
            display: flex;
            justify-content: start;
            /* gap: 1rem; */
        }
        .item2 ul{
            gap: 1rem;
        }
    }
    @media(max-width:335px){
        nav{
            min-height:10vh;
            min-width: 10vw;
            display: flex;
            flex-direction: column;
        }
        .box{
            display: flex;
            flex-direction: column;
        }
    }
    @media(max-width:303px){
        .box .item2{
            font-size: small;
        }
        .item2 ul{
            gap: 0.5em;
            /* font-size: small; */
        }
    }
</style>

<body>
    <header>
        <nav>
            <div class="box item1">
                <ul>
                    <li>
                        <span class="nav-span">
                            <i class="color-white fa fa-envelope"></i>
                            <a class="hidden color-white" href="#">mhhasanul@gmail.com</a>
                        </span>
                    </li>
                    <li>

                        <span class="nav-span">
                            <i class=" call fa fa-phone"></i>
                            <p class="hidden color-white">(12345)67890</p>
                        </span>
                    </li>
                </ul>
            </div>
            <div class="box item2">
                <ul>
                    <li>
                        <!-- <label for="language"></label> -->
                        <select class="border-background" name="medium" id="language">
                            <option value="english">English</option>
                            <option value="germany">Germany</option>
                            <option value="spanish">Spanish</option>
                        </select>
                    </li>
                    <li>
                        <!-- <label for="payout"></label> -->
                        <select class="border-background1" name="currency" id="payout">
                            <option value="usd">USD</option>
                            <option value="euro">EURO</option>
                            <option value="pound">Pound</option>
                        </select>
                    </li>
                    <li>
                        <span>
                            Login
                            <i class="fa fa-tablet fa-user" aria-hidden="true"></i>
                        </span>

                    </li>
                    <li>
                        Whishlist
                        <i class="fa fa-tablet fa-heart" aria-hidden="true"></i>
                    </li>
                    <li>
                        <i class="fa fa-shopping-cart" aria-hidden="true"></i>

                    </li>
                </ul>
            </div>
        </nav>
    </header>
</body>

</html>
