<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height:200px;
            width:200px;
            background-color: blue;
            color:white;
            transition-property:all;
            transition-duration:0.5s;
            transition-timing-function:ease-in;/*ease-in-out, steps(5), linear, cubic,*/
            transition-delay:0.5s;
        }
        .box:hover{
            background-color:red;
        }
        .box:active{
            background-color:green;
        }
    </style>
</head>
<body>
    <div class="box">
        This is a box
    </div>
</body>
</html>
