<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        body{
            height:100vh;
            width:100vw;
        }
        .container {
            border:2px solid;
            height:100%;
            width:100%;
            display:grid;
            padding:5rem;
            /* row-gap:1rem; */
            /* column-gap:1rem; */
            gap:0.5rem 0.5rem;
            /* grid-template-rows:100px 100px; */
            /* grid-template-rows:1fr 1fr;--------> grid-template-rows: repeat(2,1fr) */
            grid-template-rows: repeat(4,1fr);
            grid-template-columns:1fr 1fr 1fr;
           background-color:rgba(59,57,57,0.5);
        }
        .item {
            display:flex;
            justify-content:center;
            align-items:center;
            background-color:rgba(227, 8, 8, 0.4);
            border: 1px solid;
            width:100%;
            color:white;
            font-size:1.5rem;
        }
        .header{
            height:100%;
            grid-column-start:1;
            grid-column-end:4;
        }
        .footer{
            height:100%;
            grid-column-start:1;
            grid-column-end:4;
        }
        .sidebar{
            grid-row-start:2;
            grid-row-end:4;
        }
        .content1{
            grid-column-start:2;
            grid-column-end:4;
            grid-auto-flow: dense;
        }
        .content2{
            grid-column-start:2;
            grid-column-end:3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item header">Header</div>
        <div class="item sidebar">SideBar</div>
        <div class="item content1">Content1</div>
        <div class="item content2">Content2</div>
        <div class="item content3">Content3</div>
        <div class="item footer">Footer</div>
    </div>
</body>
</html>
